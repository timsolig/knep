name: test

# Testerna på syntetiska data för varje pull request och push till main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  # Driftens bild, byggd på arm64 som på Pi:n
  docker:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f deploy/Dockerfile -t knep-drift .
      # installera grenens commit i bilden som driften gör (uv sync, modellerna, knep --help)
      - run: >
          docker run --rm -e KNEP_PREPARE_ONLY=1
          -e KNEP_REPO=https://github.com/${{ github.repository }}.git
          -e KNEP_BRANCH=${{ github.head_ref || github.ref_name }}
          knep-drift
