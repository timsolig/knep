name: test

# Testerna på syntetiska data för varje pull request och push till main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  # Driftens bild, byggd på arm64 som på Pi:n
  docker:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f deploy/Dockerfile -t knep .
      - run: docker run --rm knep knep-models status
      - run: docker run --rm knep knep --help
