[project]
name = "nowcast"
version = "0.1.0"
description = "Nederbördsnowcast från SMHI:s radarkomposit, körs på en Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "requests",
    "rasterio",
    "pillow",
    "pysteps",
    "opencv-python-headless",
    "h5py",
    "scikit-learn==1.9.1",
    "pyproj>=3.7.2",
]

[project.scripts]
nowcast = "nowcast.cli:main"
nowcast-case = "nowcast.cases:main"
nowcast-bias = "nowcast.bias:main"
nowcast-models = "nowcast.models:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
